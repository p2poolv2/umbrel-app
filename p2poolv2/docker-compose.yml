version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: p2poolv2
      APP_PORT: 46884

  p2poolv2:
    image: ogunseye/p2poolv2:0.13.0
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "3333:3333"
      - "6884:6884"
    volumes:
      - ${APP_DATA_DIR}/data:/p2poolv2/data
    environment:
      P2POOL_BITCOINRPC_URL: "http://$APP_BITCOIN_NODE_IP:$APP_BITCOIN_RPC_PORT"
      P2POOL_BITCOINRPC_USERNAME: $APP_BITCOIN_RPC_USER
      P2POOL_BITCOINRPC_PASSWORD: $APP_BITCOIN_RPC_PASS
      P2POOL_STATIC_DIR: /var/www/dashboard
      P2POOL_STRATUM_ZMQPUBHASHBLOCK: "tcp://$APP_BITCOIN_NODE_IP:$APP_BITCOIN_ZMQ_HASHBLOCK_PORT"
